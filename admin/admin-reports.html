<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!-- Favicon & Icons -->
<link rel="icon" type="image/png" href="/WebsiteLogo.png"/>
<link rel="apple-touch-icon" href="/WebsiteLogo.png"/>
<link rel="shortcut icon" href="/WebsiteLogo.png"/>
<title>Reports – ClassMinds Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin-styles.css"/>
</head>
<body>
<div class="admin-wrap" id="adminWrap">
  <div class="sidebar" id="sidebarSlot"></div>
  <div class="main">
    <div class="page-header">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div><div class="page-title">Message Reports</div><div class="page-desc">Review reported chat messages</div></div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost report-filter active" data-filter="all">All</button>
          <button class="btn btn-ghost report-filter" data-filter="pending">Pending</button>
          <button class="btn btn-ghost report-filter" data-filter="reviewed">Reviewed</button>
          <button class="btn btn-ghost report-filter" data-filter="dismissed">Dismissed</button>
        </div>
      </div>
    </div>
    <div class="stats-row" id="reportStats"></div>
    <div id="reportsList"><div class="empty-state"><div class="spinner"></div></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script type="module">
import { requireAdmin, db, doc, updateDoc, deleteDoc, collection, getDocs, query, orderBy, toast, escapeHtml, safeImageEl } from './admin-shared.js';
import { renderSidebar } from './admin-sidebar.js';
renderSidebar();
requireAdmin().then(async () => {
  let allReports = [], currentFilter = 'all';
  const snap = await getDocs(query(collection(db,'reports'), orderBy('createdAt','desc')));
  allReports = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  function renderStats() {
    const p = allReports.filter(r => r.status === 'pending').length;
    const rv = allReports.filter(r => r.status === 'reviewed').length;
    const dm = allReports.filter(r => r.status === 'dismissed').length;
    document.getElementById('reportStats').innerHTML =
      `<div class="stat-card" style="--stat-color:var(--red)"><div class="stat-val">${allReports.length}</div><div class="stat-lbl">Total</div></div>` +
      `<div class="stat-card" style="--stat-color:var(--yellow)"><div class="stat-val">${p}</div><div class="stat-lbl">Pending</div></div>` +
      `<div class="stat-card" style="--stat-color:var(--green)"><div class="stat-val">${rv}</div><div class="stat-lbl">Reviewed</div></div>` +
      `<div class="stat-card" style="--stat-color:var(--purple)"><div class="stat-val">${dm}</div><div class="stat-lbl">Dismissed</div></div>`;
  }

  function filter(f) {
    currentFilter = f;
    document.querySelectorAll('.report-filter').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
    let reports = allReports;
    if (f !== 'all') reports = reports.filter(r => r.status === f);
    render(reports);
  }

  // Build a single report card via DOM APIs (HIGH-3: no string-concat for
  // user-controlled imageUrl/gifUrl).
  function buildReportCard(r) {
    const card = document.createElement('div');
    card.className = 'table-card';
    card.style.padding = '16px 20px';
    card.style.marginBottom = '10px';

    const date = r.createdAt
      ? new Date(r.createdAt * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : '';
    const sc = r.status === 'pending' ? 'var(--yellow)'
             : r.status === 'reviewed' ? 'var(--green)'
             : 'var(--purple)';
    const reasonLabel = ({ inappropriate: 'Inappropriate', spam: 'Spam', harassment: 'Harassment', other: 'Other' })[r.reason] || (r.reason || '');

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px';
    header.innerHTML =
      `<div style="display:flex;align-items:center;gap:8px">` +
        `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:${sc}22;color:${sc};border:1px solid ${sc}44">` +
          `<span style="width:6px;height:6px;border-radius:50%;background:${sc}"></span>${escapeHtml(r.status || 'pending')}` +
        `</span>` +
        `<span style="padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)">${escapeHtml(reasonLabel)}</span>` +
      `</div>` +
      `<span style="font-size:11px;color:var(--muted)">${escapeHtml(date)}</span>`;

    const msgBox = document.createElement('div');
    msgBox.style.cssText = 'background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;padding:12px;margin-bottom:10px';
    const meta = document.createElement('div');
    meta.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:4px';
    meta.textContent = `${r.senderName || 'Unknown'} in ${r.courseCode || ''}`;
    msgBox.appendChild(meta);

    if (r.imageUrl) {
      const img = safeImageEl(r.imageUrl, {
        maxWidth: '200px', maxHeight: '150px',
        borderRadius: '8px', marginBottom: '8px',
        openInNewTab: true,
      });
      if (img) msgBox.appendChild(img);
    }
    if (r.gifUrl) {
      const gif = safeImageEl(r.gifUrl, {
        maxWidth: '200px', maxHeight: '150px',
        borderRadius: '8px', marginBottom: '8px',
      });
      if (gif) msgBox.appendChild(gif);
    }

    const text = document.createElement('div');
    text.style.cssText = 'font-size:14px;color:var(--white);line-height:1.5';
    text.textContent = r.messageText
      ? r.messageText
      : (!r.imageUrl && !r.gifUrl ? '(empty)' : '');
    msgBox.appendChild(text);

    card.appendChild(header);
    card.appendChild(msgBox);

    if (r.details) {
      const det = document.createElement('div');
      det.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic';
      det.textContent = `"${r.details}"`;
      card.appendChild(det);
    }

    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px';
    actions.innerHTML =
      `<div style="font-size:11px;color:var(--muted)">Reported by <strong style="color:var(--white)">${escapeHtml(r.reporterName || 'Unknown')}</strong></div>` +
      `<div class="rpt-buttons" style="display:flex;gap:6px"></div>`;
    const buttons = actions.querySelector('.rpt-buttons');

    function makeBtn(label, cls, action, extra = {}) {
      const b = document.createElement('button');
      b.className = `btn ${cls} rpt-action`;
      b.style.fontSize = '11px';
      b.style.padding = '5px 12px';
      b.dataset.id = r.id;
      b.dataset.action = action;
      Object.entries(extra).forEach(([k, v]) => { b.dataset[k] = v; });
      b.textContent = label;
      return b;
    }

    if (r.status === 'pending') {
      buttons.appendChild(makeBtn('Mark Reviewed', 'btn-green', 'reviewed'));
      buttons.appendChild(makeBtn('Dismiss', 'btn-ghost', 'dismissed'));
      const del = document.createElement('button');
      del.className = 'btn btn-red rpt-del';
      del.style.fontSize = '11px';
      del.style.padding = '5px 12px';
      del.dataset.id = r.id;
      del.dataset.class = r.classId || '';
      del.dataset.msg = r.messageId || '';
      del.textContent = 'Delete Message';
      buttons.appendChild(del);
    } else {
      buttons.appendChild(makeBtn('Reopen', 'btn-ghost', 'pending'));
    }
    card.appendChild(actions);

    return card;
  }

  function render(reports) {
    const el = document.getElementById('reportsList');
    if (!reports.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon"></div>No reports</div>';
      return;
    }
    el.innerHTML = '';
    const frag = document.createDocumentFragment();
    reports.forEach(r => frag.appendChild(buildReportCard(r)));
    el.appendChild(frag);

    el.querySelectorAll('.rpt-action').forEach(b => b.addEventListener('click', async function () {
      const id = this.dataset.id, action = this.dataset.action;
      await updateDoc(doc(db, 'reports', id), { status: action, reviewedAt: Date.now() / 1000 });
      const r = allReports.find(r => r.id === id);
      if (r) r.status = action;
      renderStats(); filter(currentFilter); toast('Report ' + action);
    }));
    el.querySelectorAll('.rpt-del').forEach(b => b.addEventListener('click', async function () {
      if (!confirm('Delete this message?')) return;
      const rid = this.dataset.id, cid = this.dataset.class, mid = this.dataset.msg;
      try {
        await deleteDoc(doc(db, 'classes', cid, 'messages', mid));
        await updateDoc(doc(db, 'reports', rid), { status: 'reviewed', action: 'deleted', reviewedAt: Date.now() / 1000 });
        const r = allReports.find(r => r.id === rid);
        if (r) r.status = 'reviewed';
        renderStats(); filter(currentFilter); toast('Message deleted & report reviewed');
      } catch (e) { toast('Failed', 'error'); }
    }));
  }

  document.querySelectorAll('.report-filter').forEach(b => b.addEventListener('click', function () { filter(this.dataset.filter); }));
  renderStats(); filter('all');
});
document.getElementById('logoutBtn')?.addEventListener('click', () => { import('./admin-shared.js').then(m => m.doLogout()); });
</script>
</body>
</html>
