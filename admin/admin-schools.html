<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/WebsiteLogo.png"/>
<link rel="apple-touch-icon" href="/WebsiteLogo.png"/>
<title>Schools – ClassMinds Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin-styles.css"/>
<style>
  .tabs { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid rgba(180,200,255,0.08); }
  .tab { padding:10px 16px; cursor:pointer; color:var(--muted); font-size:13px; border-bottom:2px solid transparent; }
  .tab.active { color:#fff; border-bottom-color:#1a6bff; }
  .tab-panel { display:none; } .tab-panel.active { display:block; }
  .form-row { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .form-row label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }
  .form-row input, .form-row textarea { padding:10px 12px; background:rgba(255,255,255,0.04); border:1px solid rgba(180,200,255,0.08); border-radius:8px; color:#fff; font-family:inherit; font-size:14px; }
</style>
</head>
<body>
<div class="admin-wrap" id="adminWrap">
  <div class="sidebar" id="sidebarSlot"></div>
  <div class="main">
    <div class="page-header">
      <div class="page-title">Schools</div>
      <div class="page-desc">Approve user requests, browse the curated /schools directory, add schools manually.</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="pending">Pending requests <span id="pendingCount" style="opacity:0.6"></span></div>
      <div class="tab" data-tab="all">All schools</div>
      <div class="tab" data-tab="add">Add manually</div>
    </div>

    <div id="tabPending" class="tab-panel active">
      <div id="pendingList"><div class="empty-state"><div class="spinner"></div></div></div>
    </div>

    <div id="tabAll" class="tab-panel">
      <input class="search-input" id="schoolsSearch" placeholder="Search by name or domain..." style="width:280px;margin-bottom:14px"/>
      <div id="allSchoolsList"><div class="empty-state"><div class="spinner"></div></div></div>
    </div>

    <div id="tabAdd" class="tab-panel">
      <div class="table-card" style="padding:20px;max-width:520px">
        <div class="form-row"><label>School name</label><input id="addName" placeholder="e.g. Pacific Cascade College"/></div>
        <div class="form-row"><label>Email domains (comma-separated)</label><input id="addDomains" placeholder="pacificcascade.edu, pcc.edu"/></div>
        <div class="form-row"><label>State (optional)</label><input id="addState" placeholder="WA"/></div>
        <button class="btn btn-blue" id="addSubmit">Create school</button>
        <div style="margin-top:12px;font-size:12px;color:var(--muted)">
          Manual creates use the same callable as approval — they're audit-logged
          with <code>action:"adminApproveSchoolRequest"</code> and <code>requestId:"manual-&lt;ts&gt;"</code>.
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">
import {
  requireAdmin, db, doc, getDoc, collection, getDocs, query, where, orderBy, limit, fmtDate, escapeHtml, toast,
  adminApproveSchoolRequestFn, adminRejectSchoolRequestFn,
} from './admin-shared.js';
import { renderSidebar } from './admin-sidebar.js';
renderSidebar();

requireAdmin().then(async () => {
  // ---- Tab switching ----
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      const id = 'tab' + t.dataset.tab.charAt(0).toUpperCase() + t.dataset.tab.slice(1);
      document.getElementById(id).classList.add('active');
    });
  });

  // ---- Pending requests ----
  await loadPending();
  async function loadPending() {
    const list = document.getElementById('pendingList');
    list.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
    let snap;
    try {
      snap = await getDocs(query(
        collection(db, 'schoolRequests'),
        where('status', '==', 'pending'),
        orderBy('createdAt', 'desc'),
        limit(50)
      ));
    } catch (e) {
      list.textContent = 'Failed to load: ' + (e.message || e);
      return;
    }
    document.getElementById('pendingCount').textContent = snap.size ? '(' + snap.size + ')' : '';
    if (snap.empty) {
      list.innerHTML = '<div class="empty-state" style="padding:48px;color:var(--muted)">No pending requests.</div>';
      return;
    }
    list.innerHTML = '';
    for (const d of snap.docs) {
      const r = d.data();
      const card = document.createElement('div');
      card.className = 'table-card';
      card.style.cssText = 'padding:18px;margin-bottom:12px';

      const h = document.createElement('div');
      h.style.cssText = 'display:flex;justify-content:space-between;gap:16px;margin-bottom:10px';
      const left = document.createElement('div');
      left.innerHTML = `<div style="font-weight:600;font-size:15px">${escapeHtml(r.requestedName || '—')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">Domain: <code>${escapeHtml(r.emailDomain || '—')}</code></div>
        <div style="font-size:12px;color:var(--muted)">Requested by: <code>${escapeHtml(r.requestedBy || '—')}</code></div>
        <div style="font-size:12px;color:var(--muted)">${fmtDate(r.createdAt ? new Date(r.createdAt * 1000) : null)}</div>`;
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;flex-direction:column;gap:6px';
      const approveBtn = document.createElement('button'); approveBtn.className='btn btn-blue'; approveBtn.textContent='Approve';
      const rejectBtn = document.createElement('button'); rejectBtn.className='btn btn-red'; rejectBtn.textContent='Reject';
      actions.appendChild(approveBtn); actions.appendChild(rejectBtn);
      h.appendChild(left); h.appendChild(actions);
      card.appendChild(h);

      if (r.additionalNotes) {
        const notes = document.createElement('div');
        notes.style.cssText = 'background:rgba(180,200,255,0.04);padding:10px 12px;border-radius:8px;font-size:13px;color:var(--muted);white-space:pre-wrap';
        notes.textContent = r.additionalNotes;
        card.appendChild(notes);
      }
      list.appendChild(card);

      approveBtn.addEventListener('click', async () => {
        const name = prompt('School name:', r.requestedName || '');
        if (!name) return;
        const domainsStr = prompt('Allowed domains (comma-separated):', r.emailDomain || '');
        if (!domainsStr) return;
        const state = prompt('State (optional):', '') || '';
        const domains = domainsStr.split(',').map(s => s.trim()).filter(Boolean);
        if (!domains.length) { alert('At least one domain required.'); return; }
        approveBtn.disabled = true; approveBtn.textContent = 'Approving…';
        try {
          const res = await adminApproveSchoolRequestFn({ requestId: d.id, name, domains, state });
          toast('Approved → ' + (res.data?.schoolId || ''));
          await loadPending();
        } catch (e) {
          alert('Failed: ' + (e.message || e));
          approveBtn.disabled = false; approveBtn.textContent = 'Approve';
        }
      });
      rejectBtn.addEventListener('click', async () => {
        const reason = prompt('Reason for rejection (required, ≤500 chars):', '');
        if (!reason || !reason.trim()) return;
        rejectBtn.disabled = true; rejectBtn.textContent = 'Rejecting…';
        try {
          await adminRejectSchoolRequestFn({ requestId: d.id, reason: reason.trim().slice(0, 500) });
          toast('Rejected');
          await loadPending();
        } catch (e) {
          alert('Failed: ' + (e.message || e));
          rejectBtn.disabled = false; rejectBtn.textContent = 'Reject';
        }
      });
    }
  }

  // ---- All schools tab (lazy on first show) ----
  let loadedAll = false;
  document.querySelector('[data-tab="all"]').addEventListener('click', async () => {
    if (loadedAll) return;
    loadedAll = true;
    await loadAll();
  });
  async function loadAll() {
    const list = document.getElementById('allSchoolsList');
    list.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
    let snap;
    try {
      snap = await getDocs(query(collection(db, 'schools'), orderBy('lowercasedName'), limit(500)));
    } catch (e) {
      list.textContent = 'Failed to load: ' + (e.message || e);
      return;
    }
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    function render(rows) {
      if (!rows.length) {
        list.innerHTML = '<div class="empty-state" style="padding:48px;color:var(--muted)">No schools.</div>';
        return;
      }
      const wrap = document.createElement('div'); wrap.className = 'table-card';
      const tbl = document.createElement('table');
      tbl.innerHTML = '<thead><tr><th>School</th><th>Domains</th><th>State</th><th>Active</th><th>Source</th></tr></thead>';
      const tbody = document.createElement('tbody');
      for (const s of rows) {
        const tr = document.createElement('tr');
        const c1 = document.createElement('td'); c1.textContent = s.name || s.id; c1.style.fontWeight = '500';
        const c2 = document.createElement('td'); c2.style.fontSize = '11px'; c2.style.color = 'var(--muted)';
        c2.textContent = (s.domains || []).join(', ');
        const c3 = document.createElement('td'); c3.textContent = s.state || '—';
        const c4 = document.createElement('td'); c4.textContent = s.active ? '✓' : '✗';
        const c5 = document.createElement('td'); c5.style.fontSize = '11px'; c5.style.color = 'var(--muted)'; c5.textContent = s.source || '—';
        tr.append(c1, c2, c3, c4, c5);
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      const scroll = document.createElement('div'); scroll.style.overflowX = 'auto'; scroll.appendChild(tbl);
      wrap.innerHTML = ''; wrap.appendChild(scroll);
      list.innerHTML = ''; list.appendChild(wrap);
    }
    render(all);
    document.getElementById('schoolsSearch').addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      render(all.filter(s =>
        (s.name || '').toLowerCase().includes(q) ||
        (s.domains || []).some(d => d.includes(q))
      ));
    });
  }

  // ---- Add manually ----
  document.getElementById('addSubmit').addEventListener('click', async () => {
    const name = document.getElementById('addName').value.trim();
    const domainsStr = document.getElementById('addDomains').value.trim();
    const state = document.getElementById('addState').value.trim();
    if (!name || !domainsStr) { alert('Name + domains required.'); return; }
    const domains = domainsStr.split(',').map(s => s.trim()).filter(Boolean);
    if (!domains.length) { alert('At least one domain required.'); return; }
    if (!confirm(`Create "${name}" with domains: ${domains.join(', ')}?`)) return;

    // Synthesize a /schoolRequests doc so adminApproveSchoolRequest can run
    // through its existing audit-trail path (it requires status=="pending").
    try {
      const tmpId = 'manual-' + Date.now();
      const { addDoc, Timestamp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const newReq = await addDoc(collection(db, 'schoolRequests'), {
        requestedBy: 'admin-manual',
        requestedName: name,
        emailDomain: domains[0],
        status: 'pending',
        createdAt: Date.now() / 1000,
        additionalNotes: 'Created manually via admin-schools.html',
      });
      const res = await adminApproveSchoolRequestFn({ requestId: newReq.id, name, domains, state });
      toast('Created → ' + (res.data?.schoolId || ''));
      document.getElementById('addName').value = '';
      document.getElementById('addDomains').value = '';
      document.getElementById('addState').value = '';
    } catch (e) {
      alert('Failed: ' + (e.message || e));
    }
  });
});

document.getElementById('logoutBtn')?.addEventListener('click', () => {
  import('./admin-shared.js').then(m => m.doLogout());
});
</script>
</body>
</html>
