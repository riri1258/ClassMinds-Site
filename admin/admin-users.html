<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<!-- Favicon & Icons -->
<link rel="icon" type="image/png" href="/WebsiteLogo.png"/>
<link rel="apple-touch-icon" href="/WebsiteLogo.png"/>
<link rel="shortcut icon" href="/WebsiteLogo.png"/>
<title>Users – ClassMinds Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin-styles.css"/>
</head>
<body>
<div class="admin-wrap" id="adminWrap">
  <div class="sidebar" id="sidebarSlot"></div>
  <div class="main">
    <div class="page-header"><div class="page-title">Users</div><div class="page-desc">All registered accounts</div></div>
    <div class="table-card">
      <div class="table-header"><div class="table-title" id="usersCount">Users</div><input class="search-input" id="usersSearch" placeholder="Search..."/></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Email</th><th>College</th><th>Joined</th><th>Admin</th><th>Actions</th></tr></thead><tbody id="usersTable"><tr><td colspan="6"><div class="empty-state"><div class="spinner"></div></div></td></tr></tbody></table></div>
    </div>
  </div>
</div>

<!-- USER PROFILE MODAL -->
<div class="modal-overlay" id="userProfileModal">
  <div class="modal-box" style="max-width:640px;max-height:85vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
    <div style="padding:20px 24px;border-bottom:1px solid var(--navy-border);flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:14px">
          <div id="upAvatar" style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#534AB7);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white;flex-shrink:0"></div>
          <div>
            <div id="upName" style="font-family:var(--font-display);font-size:18px;font-weight:700"></div>
            <div id="upEmail" style="font-size:12px;color:var(--muted)"></div>
            <div style="display:flex;gap:6px;margin-top:4px">
              <span id="upSchool" style="font-size:10px;color:var(--blue-bright);padding:2px 8px;background:rgba(26,107,255,0.1);border-radius:100px"></span>
              <span id="upAdminBadge" style="font-size:10px;color:var(--yellow);padding:2px 8px;background:rgba(245,158,11,0.1);border-radius:100px;display:none">Admin</span>
            </div>
          </div>
        </div>
        <button class="btn btn-ghost" style="font-size:14px;padding:6px 12px" onclick="closeModal('userProfileModal')">✕</button>
      </div>
    </div>
    <div style="display:flex;border-bottom:1px solid var(--navy-border);flex-shrink:0;padding:0 24px;gap:4px">
      <button class="btn btn-ghost up-tab active" data-tab="overview" style="font-size:12px;padding:10px 14px;border-radius:0;border-bottom:2px solid var(--blue)">Overview</button>
      <button class="btn btn-ghost up-tab" data-tab="classes" style="font-size:12px;padding:10px 14px;border-radius:0">Classes</button>
      <button class="btn btn-ghost up-tab" data-tab="activity" style="font-size:12px;padding:10px 14px;border-radius:0">Activity</button>
      <button class="btn btn-ghost up-tab" data-tab="tickets" style="font-size:12px;padding:10px 14px;border-radius:0">Tickets</button>
    </div>
    <div id="upContent" style="flex:1;overflow-y:auto;padding:20px 24px">
      <div style="text-align:center;padding:40px 0"><div class="spinner"></div></div>
    </div>
    <div style="padding:12px 24px;border-top:1px solid var(--navy-border);flex-shrink:0;display:flex;gap:8px">
      <button class="btn btn-ghost" style="font-size:12px" id="upToggleAdminBtn">Make Admin</button>
      <div style="flex:1"></div>
      <button class="btn btn-red" style="font-size:12px" id="upDeleteBtn">Delete User</button>
    </div>
  </div>
</div>

<!-- TICKET CHAT MODAL -->
<div class="modal-overlay" id="ticketChatModal">
  <div class="modal-box" style="max-width:560px;height:80vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--navy-border);display:flex;align-items:center;gap:12px;flex-shrink:0">
      <div style="width:36px;height:36px;border-radius:50%;background:rgba(26,107,255,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">🎫</div>
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--font-display);font-size:15px;font-weight:700" id="tchatTitle"></div>
        <div style="font-size:11px;color:var(--muted)" id="tchatMeta"></div>
      </div>
      <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="closeModal('ticketChatModal')">✕ Close</button>
    </div>
    <div id="tchatMessages" style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--navy-border);display:flex;gap:10px;flex-shrink:0;align-items:flex-end">
      <textarea class="field-input" id="tchatReply" placeholder="Reply as admin..." style="margin-bottom:0;min-height:40px;max-height:100px;resize:none;flex:1;font-size:14px" rows="1"></textarea>
      <button class="btn btn-blue" style="padding:10px 16px;flex-shrink:0" id="tchatSendBtn">Send ↗</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">
import { requireAdmin, db, auth, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, query, orderBy, limit, toast, fmtDate, escapeHtml, openModal, closeModal, adminGrantRoleFn, adminDeleteUserFn } from './admin-shared.js';
import { renderSidebar } from './admin-sidebar.js';
window.closeModal = closeModal;

renderSidebar();
requireAdmin().then(async () => {
  const snap = await getDocs(collection(db,'users'));
  let allUsers = snap.docs.map(d=>({id:d.id,...d.data()}));
  let allClasses = [];
  try { const cs = await getDocs(collection(db,'classes')); allClasses = cs.docs.map(d=>({id:d.id,...d.data()})); } catch(e){}

  let currentProfileUid = '';

  function renderUsers(data){
    document.getElementById('usersCount').textContent=data.length+' Users';
    const tbody=document.getElementById('usersTable');
    if(!data.length){tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">👤</div>No users yet</div></td></tr>';return;}
    tbody.innerHTML=data.map(u=>`<tr><td class="user-name-cell" data-uid="${u.id}" style="cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:50%;background:rgba(26,107,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--blue-bright);flex-shrink:0">${(u.firstName||'?').charAt(0)}${(u.lastName||'').charAt(0)}</div><span style="color:var(--blue-bright);text-decoration:underline">${escapeHtml((u.firstName||'')+' '+(u.lastName||''))}</span></div></td><td style="color:var(--muted);font-size:12px">${escapeHtml(u.email||'—')}</td><td style="font-size:12px">${escapeHtml(u.college||'—')}</td><td style="font-size:11px;color:var(--muted)">${u.createdAt?fmtDate(new Date(u.createdAt*1000)):'—'}</td><td>${u.isAdmin?'<span class="role-badge role-admin">Admin</span>':''}</td><td><div style="display:flex;gap:6px"><button class="btn btn-ghost toggle-admin-btn" data-uid="${u.id}" style="font-size:11px">${u.isAdmin?'Remove Admin':'Make Admin'}</button><button class="btn btn-red del-user-btn" data-uid="${u.id}" style="font-size:11px;padding:4px 10px">🗑 Delete</button></div></td></tr>`).join('');

    tbody.querySelectorAll('.user-name-cell').forEach(c=>c.addEventListener('click',()=>openProfile(c.dataset.uid)));
    // H-1: role changes go through adminGrantRole server callable (audit log + rules bypass).
    tbody.querySelectorAll('.toggle-admin-btn').forEach(b=>b.addEventListener('click',async function(){
      const uid=this.dataset.uid,u=allUsers.find(u=>u.id===uid);if(!u)return;
      const make=!u.isAdmin;
      const confirmText=prompt('Type '+(make?'GRANT':'REVOKE')+' to '+(make?'grant':'revoke')+' admin for '+(u.firstName||'')+' '+(u.lastName||''));
      if(confirmText!==(make?'GRANT':'REVOKE'))return;
      try{
        await adminGrantRoleFn({targetUid:uid,makeAdmin:make,confirmText});
        u.isAdmin=make;
        renderUsers(allUsers);
        toast(make?'Admin granted ✓':'Admin removed ✓');
      }catch(e){toast('Failed: '+(e?.message||'error'),'error');}
    }));
    // H-3: cascade delete routed through adminDeleteUser (tombstones messages, purges Storage, audits).
    tbody.querySelectorAll('.del-user-btn').forEach(b=>b.addEventListener('click',async function(){
      const uid=this.dataset.uid,u=allUsers.find(u=>u.id===uid);
      const name=((u?.firstName||'')+' '+(u?.lastName||'')).trim()||'this user';
      const reason=prompt('Delete '+name+' and ALL their data? This cannot be undone.\n\nType DELETE to confirm (optionally add a reason):\n\nExample:  DELETE   GDPR request #42');
      if(!reason)return;
      const parts=reason.trim().split(/\s+/);
      if(parts[0]!=='DELETE'){toast('Cancelled — type "DELETE" to confirm','error');return;}
      const reasonText=parts.slice(1).join(' ');
      try{
        const res=await adminDeleteUserFn({targetUid:uid,confirmText:'DELETE',reason:reasonText});
        allUsers=allUsers.filter(u=>u.id!==uid);
        renderUsers(allUsers);
        toast('User deleted ✓ ('+(res?.data?.steps?.length||'?')+' cascade steps)');
      }catch(e){toast('Failed: '+(e?.message||'error'),'error');}
    }));
  }

  document.getElementById('usersSearch').addEventListener('input',function(){
    const q=this.value.toLowerCase();
    renderUsers(allUsers.filter(u=>(u.firstName+' '+u.lastName+' '+(u.email||'')).toLowerCase().includes(q)));
  });

  // Profile modal
  async function openProfile(uid){
    currentProfileUid=uid;
    const u=allUsers.find(u=>u.id===uid);if(!u)return;
    document.getElementById('upAvatar').textContent=(u.firstName||'?').charAt(0)+(u.lastName||'').charAt(0);
    document.getElementById('upName').textContent=(u.firstName||'')+' '+(u.lastName||'');
    document.getElementById('upEmail').textContent=u.email||'';
    document.getElementById('upSchool').textContent=u.college||'No school';
    document.getElementById('upAdminBadge').style.display=u.isAdmin?'inline':'none';
    document.getElementById('upToggleAdminBtn').textContent=u.isAdmin?'Remove Admin':'Make Admin';
    document.getElementById('upContent').innerHTML='<div style="text-align:center;padding:40px 0"><div class="spinner"></div></div>';
    openModal('userProfileModal');
    loadTab('overview');
  }

  // Tabs
  document.querySelectorAll('.up-tab').forEach(t=>t.addEventListener('click',function(){
    document.querySelectorAll('.up-tab').forEach(t2=>{t2.classList.remove('active');t2.style.borderBottom='2px solid transparent';});
    this.classList.add('active');this.style.borderBottom='2px solid var(--blue)';
    loadTab(this.dataset.tab);
  }));

  async function loadTab(tab){
    const uid=currentProfileUid,el=document.getElementById('upContent');
    el.innerHTML='<div style="text-align:center;padding:40px 0"><div class="spinner"></div></div>';
    const u=allUsers.find(u=>u.id===uid);

    if(tab==='overview'){
      let stats={};
      try{const s=await getDoc(doc(db,'users',uid,'stats','summary'));if(s.exists())stats=s.data();}catch(e){}
      let classCount=0;try{const j=await getDocs(collection(db,'users',uid,'joinedClasses'));classCount=j.size;}catch(e){}
      let ticketCount=0;try{const t=await getDocs(collection(db,'tickets'));ticketCount=t.docs.filter(d=>d.data().userId===uid).length;}catch(e){}
      const joined=u?.createdAt?new Date(u.createdAt*1000).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'Unknown';
      el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px"><div style="padding:14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--green)">${stats.dayStreak||0}</div><div style="font-size:10px;color:var(--muted)">Day streak</div></div><div style="padding:14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--blue-bright)">${classCount}</div><div style="font-size:10px;color:var(--muted)">Classes</div></div><div style="padding:14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--purple)">${stats.flashcardsDone||0}</div><div style="font-size:10px;color:var(--muted)">Flashcards</div></div><div style="padding:14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--yellow)">${stats.avgQuizScore||0}%</div><div style="font-size:10px;color:var(--muted)">Quiz avg</div></div></div><div style="font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.8px;margin-bottom:8px">DETAILS</div><div style="background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;overflow:hidden"><div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--navy-border)"><span style="font-size:12px;color:var(--muted)">User ID</span><span style="font-size:11px;color:var(--white);font-family:monospace">${uid.substring(0,20)}...</span></div><div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--navy-border)"><span style="font-size:12px;color:var(--muted)">Phone</span><span style="font-size:12px;color:var(--white)">${escapeHtml(u?.phone||'Not set')}</span></div><div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--navy-border)"><span style="font-size:12px;color:var(--muted)">Joined</span><span style="font-size:12px;color:var(--white)">${joined}</span></div><div style="display:flex;justify-content:space-between;padding:10px 14px"><span style="font-size:12px;color:var(--muted)">Tickets</span><span style="font-size:12px;color:var(--white)">${ticketCount}</span></div></div>`;
    } else if(tab==='classes'){
      try{const s=await getDocs(collection(db,'users',uid,'joinedClasses'));if(!s.size){el.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px 0">No classes joined</div>';return;}el.innerHTML=s.docs.map(d=>{const c=d.data();return`<div style="padding:12px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><div style="font-size:14px;font-weight:600">${escapeHtml(c.courseCode||'')}</div><span style="font-size:11px;color:var(--muted)">${escapeHtml(c.section||'')}</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">${escapeHtml(c.courseName||'')}</div><div style="font-size:11px;color:var(--muted);margin-top:4px">${(c.daysOfWeek||[]).join(', ')}${c.startTime?' · '+c.startTime+' – '+c.endTime:''}${c.instructor?' · '+escapeHtml(c.instructor):''}</div></div>`;}).join('');}catch(e){el.innerHTML='<div style="color:var(--red);padding:20px">Failed</div>';}
    } else if(tab==='activity'){
      try{const s=await getDocs(query(collection(db,'users',uid,'sessions'),orderBy('date','desc'),limit(14)));if(!s.size){el.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px 0">No activity recorded</div>';return;}el.innerHTML='<div style="font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.8px;margin-bottom:10px">RECENT SESSIONS</div>'+s.docs.map(d=>{const s2=d.data();const first=s2.firstActiveAt?new Date(s2.firstActiveAt*1000).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';const last=s2.lastActiveAt?new Date(s2.lastActiveAt*1000).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';const dur=s2.firstActiveAt&&s2.lastActiveAt?Math.round((s2.lastActiveAt-s2.firstActiveAt)/60):0;return`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;margin-bottom:6px"><div><div style="font-size:13px;font-weight:500">${escapeHtml(s2.date||d.id)}</div><div style="font-size:11px;color:var(--muted)">${first}${last?' – '+last:''}</div></div><div style="text-align:right"><div style="font-size:13px;font-weight:600;color:var(--blue-bright)">${s2.sessionCount||1} session${(s2.sessionCount||1)>1?'s':''}</div><div style="font-size:11px;color:var(--muted)">${dur>0?dur+'m':'—'}</div></div></div>`;}).join('');}catch(e){el.innerHTML='<div style="color:var(--red);padding:20px">Failed</div>';}
    } else if(tab==='tickets'){
      try{const s=await getDocs(collection(db,'tickets'));const ut=s.docs.filter(d=>d.data().userId===uid).map(d=>({id:d.id,...d.data()}));if(!ut.length){el.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px 0">No tickets</div>';return;}el.innerHTML=ut.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(t=>{const sc=t.status==='open'?'var(--green)':t.status==='waiting'?'var(--yellow)':'var(--muted)';return`<div style="padding:12px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--navy-border);border-radius:10px;margin-bottom:8px;cursor:pointer" data-ticket="${t.id}" data-subject="${escapeHtml(t.subject||'')}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="width:6px;height:6px;border-radius:50%;background:${sc};flex-shrink:0"></span><span style="font-size:13px;font-weight:600">#${t.ticketNumber||'?'} ${escapeHtml(t.subject||'')}</span></div><div style="font-size:11px;color:var(--muted)">${t.category||''} · ${t.status||''} · ${t.createdAt?new Date(t.createdAt*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</div></div>`;}).join('');
      el.querySelectorAll('[data-ticket]').forEach(c=>c.addEventListener('click',function(){openTicketChat(this.dataset.ticket,this.dataset.subject);}));}catch(e){el.innerHTML='<div style="color:var(--red);padding:20px">Failed</div>';}
    }
  }

  // Profile actions — same callables as the table row buttons (H-1 / H-3).
  document.getElementById('upToggleAdminBtn').addEventListener('click',async()=>{
    const u=allUsers.find(u=>u.id===currentProfileUid);if(!u)return;
    const make=!u.isAdmin;
    const confirmText=prompt('Type '+(make?'GRANT':'REVOKE')+' to confirm');
    if(confirmText!==(make?'GRANT':'REVOKE'))return;
    try{
      await adminGrantRoleFn({targetUid:currentProfileUid,makeAdmin:make,confirmText});
      u.isAdmin=make;
      document.getElementById('upAdminBadge').style.display=u.isAdmin?'inline':'none';
      document.getElementById('upToggleAdminBtn').textContent=u.isAdmin?'Remove Admin':'Make Admin';
      renderUsers(allUsers);toast(make?'Admin granted':'Admin removed');
    }catch(e){toast('Failed: '+(e?.message||'error'),'error');}
  });
  document.getElementById('upDeleteBtn').addEventListener('click',async()=>{
    const u=allUsers.find(u=>u.id===currentProfileUid);
    const name=((u?.firstName||'')+' '+(u?.lastName||'')).trim()||'this user';
    const reason=prompt('Delete '+name+' and ALL their data? Type DELETE to confirm (optionally add a reason after):');
    if(!reason)return;
    const parts=reason.trim().split(/\s+/);
    if(parts[0]!=='DELETE'){toast('Cancelled — type "DELETE" to confirm','error');return;}
    const reasonText=parts.slice(1).join(' ');
    try{
      const res=await adminDeleteUserFn({targetUid:currentProfileUid,confirmText:'DELETE',reason:reasonText});
      allUsers=allUsers.filter(u=>u.id!==currentProfileUid);
      renderUsers(allUsers);closeModal('userProfileModal');
      toast('User deleted ✓ ('+(res?.data?.steps?.length||'?')+' cascade steps)');
    }catch(e){toast('Failed: '+(e?.message||'error'),'error');}
  });

  // Ticket chat
  let ticketListener=null;
  async function openTicketChat(ticketId,title){
    document.getElementById('tchatTitle').textContent=title||'Support Ticket';
    document.getElementById('tchatReply').value='';
    document.getElementById('tchatMessages').innerHTML='<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:13px">Loading...</div>';
    try{const t=await getDoc(doc(db,'tickets',ticketId));if(t.exists()){const td=t.data();document.getElementById('tchatMeta').textContent=`${td.userName||'User'} · ${td.userEmail||''} · #${td.ticketNumber||''}`;}
    }catch(e){}
    closeModal('userProfileModal');openModal('ticketChatModal');

    const{onSnapshot}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    if(ticketListener)ticketListener();
    ticketListener=onSnapshot(query(collection(db,'tickets',ticketId,'messages'),orderBy('createdAt','asc')),(snap)=>{
      const msgs=snap.docs.map(d=>({id:d.id,...d.data()}));
      const container=document.getElementById('tchatMessages');
      if(!msgs.length){container.innerHTML='<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:13px">No messages yet</div>';return;}
      container.innerHTML=msgs.map(m=>{const isAdmin=m.senderType==='admin';const time=m.createdAt?new Date((m.createdAt.toDate?m.createdAt.toDate():new Date(m.createdAt*1000))).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';return`<div style="display:flex;${isAdmin?'flex-direction:row-reverse':''};gap:8px;align-items:flex-end">${!isAdmin?'<div style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">👤</div>':''}<div style="max-width:75%"><div style="font-size:10px;color:var(--muted);margin-bottom:3px;${isAdmin?'text-align:right':''}">${isAdmin?'You':escapeHtml(m.senderName||'User')} · ${time}</div><div style="padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;word-break:break-word;${isAdmin?'background:var(--blue);color:white;border-bottom-right-radius:4px':'background:rgba(255,255,255,0.06);color:var(--white);border-bottom-left-radius:4px'}">${escapeHtml(m.message)}</div></div>${isAdmin?'<div style="width:28px;height:28px;border-radius:50%;background:rgba(26,107,255,0.2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:var(--blue-bright)">🛡</div>':''}</div>`;}).join('');
      container.scrollTop=container.scrollHeight;
    });

    document.getElementById('tchatSendBtn').onclick=async function(){
      const msg=document.getElementById('tchatReply').value.trim();if(!msg)return;
      this.disabled=true;this.textContent='Sending...';
      try{const now=Date.now()/1000;await setDoc(doc(collection(db,'tickets',ticketId,'messages')),{ticketId,senderId:auth.currentUser.uid,senderName:'Support Team',senderType:'admin',message:msg,createdAt:now});await updateDoc(doc(db,'tickets',ticketId),{updatedAt:now,lastReplyAt:now,lastReplyBy:'admin',status:'open'});document.getElementById('tchatReply').value='';}catch(e){toast('Failed','error');}
      this.disabled=false;this.textContent='Send ↗';
    };
  }

  renderUsers(allUsers);
});
document.getElementById('logoutBtn')?.addEventListener('click',()=>{import('./admin-shared.js').then(m=>m.doLogout());});
</script>
</body>
