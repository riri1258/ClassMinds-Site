<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/WebsiteLogo.png"/>
<link rel="apple-touch-icon" href="/WebsiteLogo.png"/>
<link rel="shortcut icon" href="/WebsiteLogo.png"/>
<title>Assignments – ClassMinds</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app-styles.css"/>
<style>
.toggle { width:36px; height:20px; border-radius:var(--r-full); background:var(--surface-04); border:0.5px solid var(--border); position:relative; cursor:pointer; transition:background 0.15s, border-color 0.15s; }
.toggle .knob { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--muted-soft); transition:left 0.15s, background 0.15s; }
.toggle.on { background:var(--blue); border-color:var(--border-active); box-shadow: 0 0 12px rgba(26,107,255,0.3); }
.toggle.on .knob { left:auto; right:2px; background:var(--white); }
</style>
</head>
<body>
<div id="sidebarSlot"></div>
<div class="page-glow"></div>
<div class="main">
  <div class="page-head">
    <div>
      <h1 class="page-title">Assignments</h1>
      <p class="page-sub" id="aTotalSub">— total · — overdue</p>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <div class="search" style="width:220px;">
        <span class="si">⌕</span>
        <input id="aSearch" class="input" placeholder="Search"/>
      </div>
      <button class="btn primary" id="newAssBtn" type="button">+ New assignment</button>
    </div>
  </div>

  <div class="pill-row" id="aFilters">
    <span class="pillf active" data-f="all">all <span class="cnt" id="cnt-all">0</span></span>
    <span class="pillf" data-f="upcoming">upcoming <span class="cnt" id="cnt-upcoming">0</span></span>
    <span class="pillf" data-f="overdue">overdue <span class="cnt" id="cnt-overdue">0</span></span>
    <span class="pillf" data-f="done">done <span class="cnt" id="cnt-done">0</span></span>
    <span class="pillf" data-f="exams">exams <span class="cnt" id="cnt-exams">0</span></span>
  </div>

  <div style="display:grid; grid-template-columns: 1fr 420px; gap:20px; flex:1; min-height:0;">
    <div id="aList" style="display:flex; flex-direction:column; gap:14px; overflow-y:auto; padding-right:4px;">
      <div style="text-align:center;padding:32px;color:var(--muted);"><div class="spinner"></div></div>
    </div>

    <div id="editPanel" style="display:none;"></div>
  </div>
</div>

<script type="module">
import{requireUser,db,doc,getDoc,setDoc,addDoc,updateDoc,collection,getDocs,loadClasses,loadAssignments,loadTests,esc,COLORS,logError,logSuccess,logInfo}from'./app-shared.js';
import{deleteDoc,Timestamp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

let uid='',allClasses=[],ccMap={},allItems=[],filter='all',activeEdit=null;

requireUser().then(async(ctx)=>{
  uid=ctx.uid;
  try{
  const cl=await loadClasses(uid);allClasses=cl.classes;ccMap=cl.colorMap;
  const [as,ts]=await Promise.all([loadAssignments(uid),loadTests(uid)]);
  allItems=[...as,...ts];
  render();
  logSuccess('Assignments loaded — '+allItems.length+' items','assignments');
  }catch(e){logError('Assignments init failed: '+e.message,'assignments');}
});

function classOf(it){return allClasses.find(c=>(c.classId||c.id)===it.classId)||allClasses.find(c=>c.courseCode===it.courseCode);}
function colorOf(it){const c=classOf(it);return c?(ccMap[c.classId||c.id]||COLORS[0]):'var(--blue)';}

function bucketize(items){
  const now=Date.now()/1000;
  const startOfToday=(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()/1000;})();
  const startOfNextWeek=startOfToday+7*86400;
  const startOfWeekAfter=startOfToday+14*86400;
  const buckets={overdue:[],thisWeek:[],nextWeek:[],later:[],done:[]};
  items.forEach(it=>{
    const isDone=it.status==='done'||it.completed;
    const isOverdue=!isDone&&it.dueDate>0&&it.dueDate<now;
    if(isDone)buckets.done.push(it);
    else if(isOverdue)buckets.overdue.push(it);
    else if(!it.dueDate||it.dueDate<startOfNextWeek)buckets.thisWeek.push(it);
    else if(it.dueDate<startOfWeekAfter)buckets.nextWeek.push(it);
    else buckets.later.push(it);
  });
  Object.values(buckets).forEach(arr=>arr.sort((a,b)=>(a.dueDate||0)-(b.dueDate||0)));
  return buckets;
}

function applyFilter(items){
  const now=Date.now()/1000;
  if(filter==='all')return items;
  if(filter==='done')return items.filter(i=>i.status==='done'||i.completed);
  if(filter==='overdue')return items.filter(i=>i.status!=='done'&&!i.completed&&i.dueDate>0&&i.dueDate<now);
  if(filter==='upcoming')return items.filter(i=>i.status!=='done'&&!i.completed&&(!i.dueDate||i.dueDate>=now));
  if(filter==='exams')return items.filter(i=>i.isExam);
  return items;
}

function chipFor(it){
  const now=Date.now()/1000;
  const isDone=it.status==='done'||it.completed;
  const isOverdue=!isDone&&it.dueDate>0&&it.dueDate<now;
  if(isOverdue){const days=Math.ceil((now-it.dueDate)/86400);return`<span class="chip red"><span class="d"></span>overdue ${days}d</span>`;}
  if(isDone)return'<span class="chip green"><span class="d"></span>done</span>';
  if(it.isExam)return'<span class="chip purple"><span class="d"></span>exam</span>';
  if(it.status==='started')return'<span class="chip yellow"><span class="d"></span>started</span>';
  if(it.dueDate){const d=Math.ceil((it.dueDate-now)/86400);if(d===0)return'<span class="chip blue"><span class="d"></span>today</span>';if(d===1)return'<span class="chip muted">tomorrow</span>';if(d<=7)return`<span class="chip muted">${d}d</span>`;return`<span class="chip muted">${new Date(it.dueDate*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'}).toLowerCase()}</span>`;}
  return'<span class="chip muted">no date</span>';
}

function metaFor(it){
  const cls=it.courseCode||classOf(it)?.courseCode||it.className||'';
  const ds=it.dueDate?new Date(it.dueDate*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'}).toLowerCase():'no date';
  return`${esc(cls)} · due ${ds}${it.isExam?' · in-class':''}${it.notes?' · '+esc((it.notes||'').slice(0,60)):''}`;
}

function render(){
  // Counts
  const now=Date.now()/1000;
  const cnt={
    all:allItems.length,
    upcoming:allItems.filter(i=>i.status!=='done'&&!i.completed&&(!i.dueDate||i.dueDate>=now)).length,
    overdue:allItems.filter(i=>i.status!=='done'&&!i.completed&&i.dueDate>0&&i.dueDate<now).length,
    done:allItems.filter(i=>i.status==='done'||i.completed).length,
    exams:allItems.filter(i=>i.isExam).length
  };
  Object.entries(cnt).forEach(([k,v])=>{const el=document.getElementById('cnt-'+k);if(el)el.textContent=v;});
  document.getElementById('aTotalSub').textContent=`${cnt.all} total · ${cnt.overdue} overdue · ${cnt.exams} exam${cnt.exams===1?'':'s'}`;

  const filtered=applyFilter(allItems);
  const search=document.getElementById('aSearch').value.trim().toLowerCase();
  const matched=search?filtered.filter(i=>(i.title||'').toLowerCase().includes(search)||(i.courseCode||'').toLowerCase().includes(search)):filtered;
  const buckets=bucketize(matched);

  const list=document.getElementById('aList');
  if(!matched.length){list.innerHTML='<div style="text-align:center;padding:48px;color:var(--muted);">📋 No assignments here.</div>';return;}

  const sectionHTML=(label,labelColor,items)=>!items.length?'':`
    <div>
      <div class="label" style="${labelColor?'color:'+labelColor+';':''} display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        ${labelColor?`<span style="width:6px; height:6px; border-radius:50%; background:${labelColor};"></span>`:''}${label}
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${items.map(it=>{
          const color=colorOf(it);
          const isDone=it.status==='done'||it.completed;
          const isOverdue=!isDone&&it.dueDate>0&&it.dueDate<Date.now()/1000;
          const ef=isDone?'done':isOverdue?'overdue':it.status||'notStarted';
          return`<div class="card a-row" data-id="${it.id}" data-ex="${it.isExam?1:0}" style="padding:14px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; ${isOverdue?'background:linear-gradient(90deg, rgba(239,68,68,0.05), var(--navy-card) 40%);border-color:rgba(239,68,68,0.22);':''}">
            <div style="width:3px; height:34px; border-radius:var(--r-full); background:${color};"></div>
            <span class="cb ${ef}" data-cb="${it.id}" data-ex="${it.isExam?1:0}"></span>
            <div style="flex:1; min-width:0;">
              <div style="font-size:14px; font-weight:600; color:var(--white); ${isDone?'text-decoration:line-through;opacity:0.55;':''}">${esc(it.title||'Untitled')}</div>
              <div style="font-size:12px; color:var(--muted); margin-top:2px;">${metaFor(it)}</div>
            </div>
            ${chipFor(it)}
            <span style="color:var(--muted); font-size:14px; padding:0 4px;">⋯</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  list.innerHTML=[
    sectionHTML('overdue','var(--red)',buckets.overdue),
    sectionHTML('this week','',buckets.thisWeek),
    sectionHTML('next week','',buckets.nextWeek),
    sectionHTML('later','',buckets.later),
    sectionHTML('done','',buckets.done)
  ].filter(Boolean).join('');

  // Checkbox toggle (cycles notStarted → started → done)
  list.querySelectorAll('[data-cb]').forEach(c=>c.addEventListener('click',async(e)=>{
    e.stopPropagation();
    const id=c.dataset.cb,isEx=c.dataset.ex==='1';
    const it=allItems.find(x=>x.id===id&&!!x.isExam===isEx);if(!it)return;
    const next=(it.status==='notStarted'||!it.status)?'started':it.status==='started'?'done':'notStarted';
    try{
      it.status=next;it.completed=(next==='done');
      await updateDoc(doc(db,'users',uid,isEx?'tests':'assignments',id),{status:next,completed:it.completed});
      render();
      logInfo('Assignment status → '+next,'assignments/cb');
    }catch(e){logError('Toggle failed: '+e.message,'assignments/cb');}
  }));

  // Row click → edit panel
  list.querySelectorAll('.a-row').forEach(r=>r.addEventListener('click',()=>{
    const id=r.dataset.id,isEx=r.dataset.ex==='1';
    const it=allItems.find(x=>x.id===id&&!!x.isExam===isEx);if(!it)return;
    openEdit(it);
  }));
}

document.getElementById('aFilters').addEventListener('click',e=>{
  const p=e.target.closest('.pillf');if(!p)return;
  document.querySelectorAll('#aFilters .pillf').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');filter=p.dataset.f;render();
});
document.getElementById('aSearch').addEventListener('input',render);
document.getElementById('newAssBtn').addEventListener('click',()=>openEdit(null));

function openEdit(it){
  activeEdit=it;
  const isNew=!it;
  const editing=it||{title:'',courseCode:'',className:'',classId:allClasses[0]?.classId||allClasses[0]?.id||'',dueDate:0,notes:'',isExam:false,status:'notStarted',completed:false};
  const panel=document.getElementById('editPanel');
  panel.style.display='block';
  panel.className='card';
  panel.style.cssText='padding:22px; display:flex; flex-direction:column; gap:14px; align-self:flex-start; border-color:var(--border-active); box-shadow: 0 0 40px rgba(26,107,255,0.12);';

  const dueLocal=editing.dueDate?new Date(editing.dueDate*1000).toISOString().slice(0,16):'';
  const cls=allClasses.find(c=>(c.classId||c.id)===editing.classId);
  const color=cls?(ccMap[cls.classId||cls.id]||COLORS[0]):'var(--blue)';

  panel.innerHTML=`
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="chip blue"><span class="d"></span>${isNew?'new':'editing'}</span>
        <span style="font-size:11px; color:var(--muted);">${esc(editing.title||'untitled')} · ${esc(editing.courseCode||cls?.courseCode||'')}</span>
      </div>
      <span id="editClose" style="font-size:18px; color:var(--muted); cursor:pointer;">×</span>
    </div>

    <div>
      <div class="label" style="margin-bottom:6px;">title</div>
      <input id="ef-title" class="input" value="${esc(editing.title||'')}" placeholder="What's this assignment?"/>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <div class="label" style="margin-bottom:6px;">class</div>
        <select id="ef-class" class="input" style="cursor:pointer;">
          ${allClasses.map(c=>{const cid=c.classId||c.id;return`<option value="${cid}" ${cid===editing.classId?'selected':''}>${esc(c.courseCode)} — ${esc(c.courseName||'')}</option>`;}).join('')}
        </select>
      </div>
      <div>
        <div class="label" style="margin-bottom:6px;">due</div>
        <input id="ef-due" class="input" type="datetime-local" value="${dueLocal}"/>
      </div>
    </div>

    <div>
      <div class="label" style="margin-bottom:6px;">notes</div>
      <textarea id="ef-notes" class="input" rows="4" style="resize:vertical; font-family:var(--font-body); line-height:1.5;">${esc(editing.notes||'')}</textarea>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; padding: 12px 14px; background:var(--surface-02); border:0.5px solid var(--border); border-radius:var(--r-lg);">
      <div>
        <div style="font-size:13px; font-weight:600; color:var(--white);">Mark as exam</div>
        <div style="font-size:11px; color:var(--muted); margin-top:2px;">adds to exams tab &amp; shows purple chip</div>
      </div>
      <div id="ef-exam" class="toggle ${editing.isExam?'on':''}"><div class="knob"></div></div>
    </div>

    <div style="display:flex; gap:10px; justify-content:flex-end;">
      ${!isNew?`<button class="btn ghost sm" id="ef-delete" style="margin-right:auto;color:var(--red);">Delete</button>`:''}
      <button class="btn ghost sm" id="ef-cancel">Cancel</button>
      <button class="btn primary sm" id="ef-save">Save</button>
    </div>
  `;

  document.getElementById('editClose').addEventListener('click',closeEdit);
  document.getElementById('ef-cancel').addEventListener('click',closeEdit);
  document.getElementById('ef-exam').addEventListener('click',function(){this.classList.toggle('on');});

  if(!isNew){
    document.getElementById('ef-delete').addEventListener('click',async()=>{
      if(!confirm('Delete "'+(editing.title||'this assignment')+'"? This can\'t be undone.'))return;
      try{
        const wasExam=!!editing.isExam;
        await deleteDoc(doc(db,'users',uid,wasExam?'tests':'assignments',editing.id));
        allItems=allItems.filter(x=>!(x.id===editing.id&&!!x.isExam===wasExam));
        closeEdit();render();
        logSuccess('Deleted assignment '+editing.id,'assignments/delete');
      }catch(e){logError('Delete failed: '+e.message,'assignments/delete');alert('Delete failed: '+e.message);}
    });
  }

  document.getElementById('ef-save').addEventListener('click',async()=>{
    try{
      const title=document.getElementById('ef-title').value.trim();
      if(!title){alert('Title is required');return;}
      const newClassId=document.getElementById('ef-class').value;
      const newCls=allClasses.find(c=>(c.classId||c.id)===newClassId);
      const dueRaw=document.getElementById('ef-due').value;
      const dueDate=dueRaw?Math.floor(new Date(dueRaw).getTime()/1000):0;
      const notes=document.getElementById('ef-notes').value;
      const willBeExam=document.getElementById('ef-exam').classList.contains('on');

      // Schema must match iOS: completed:bool, status, dueDate (unix sec), title, courseCode, className, classId
      const data={
        title,
        courseCode:newCls?.courseCode||'',
        className:newCls?.courseName||'',
        classId:newClassId,
        dueDate,
        notes,
        status:editing.status||'notStarted',
        completed:editing.completed||false
      };

      if(isNew){
        const col=willBeExam?'tests':'assignments';
        const ref=await addDoc(collection(db,'users',uid,col),data);
        allItems.push({id:ref.id,...data,isExam:willBeExam});
        logSuccess('New '+(willBeExam?'exam':'assignment')+' created: '+title+' ('+ref.id+')','assignments/save');
      }else{
        const wasExam=!!editing.isExam;
        if(wasExam!==willBeExam){
          // Migrate between collections
          const newCol=willBeExam?'tests':'assignments';
          const newRef=await addDoc(collection(db,'users',uid,newCol),data);
          await deleteDoc(doc(db,'users',uid,wasExam?'tests':'assignments',editing.id));
          allItems=allItems.filter(x=>!(x.id===editing.id&&!!x.isExam===wasExam));
          allItems.push({id:newRef.id,...data,isExam:willBeExam});
          logInfo('Migrated assignment '+editing.id+' between collections (exam='+willBeExam+')','assignments/migrate');
        }else{
          await updateDoc(doc(db,'users',uid,wasExam?'tests':'assignments',editing.id),data);
          const idx=allItems.findIndex(x=>x.id===editing.id&&!!x.isExam===wasExam);
          if(idx>=0)allItems[idx]={...allItems[idx],...data};
          logSuccess('Updated assignment '+editing.id,'assignments/save');
        }
      }
      closeEdit();render();
    }catch(e){logError('Save failed: '+e.message,'assignments/save');alert('Save failed: '+e.message);}
  });
}

function closeEdit(){activeEdit=null;document.getElementById('editPanel').style.display='none';}
</script>
</body>
</html>
