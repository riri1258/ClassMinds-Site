<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="/WebsiteLogo.png"/>
<link rel="apple-touch-icon" href="/WebsiteLogo.png"/>
<link rel="shortcut icon" href="/WebsiteLogo.png"/>
<title>Record – ClassMinds</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app-styles.css"/>
<style>
.cls-pick { padding:14px; background:var(--navy-card); border:0.5px solid var(--border); border-radius:var(--r-xl); cursor:pointer; transition:border-color 0.15s, background 0.15s; display:flex; align-items:center; gap:12px; }
.cls-pick:hover { border-color:var(--border-hover); }
.cls-pick.selected { background:var(--blue-tint-15); border:1px solid var(--border-active); box-shadow: 0 0 20px rgba(26,107,255,0.25); }
.cls-pick-bar { width:3px; height:28px; border-radius:var(--r-full); background:var(--blue); flex-shrink:0; }
.cls-pick-code { font-family:var(--font-display); font-size:14px; font-weight:700; color:var(--white); letter-spacing:-0.2px; }
.cls-pick-name { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.rec-circle { width:120px; height:120px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.3s; }
.rec-idle { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.35); box-shadow:0 0 40px rgba(239,68,68,0.15); }
.rec-idle:hover { background:rgba(239,68,68,0.15); transform:scale(1.05); }
.rec-active { background:rgba(239,68,68,0.18); border:1px solid var(--red); animation:recPulse 1.5s ease-in-out infinite; }
@keyframes recPulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.3);} 50%{box-shadow:0 0 0 24px rgba(239,68,68,0);} }
.rec-dot { width:32px; height:32px; border-radius:50%; background:var(--red); box-shadow:0 0 20px rgba(239,68,68,0.6); transition:all 0.3s; }
.rec-active .rec-dot { border-radius:8px; width:24px; height:24px; }
.rec-timer { font-family:var(--font-display); font-size:40px; font-weight:800; letter-spacing:-1px; color:var(--white); font-variant-numeric:tabular-nums; }
.rec-hint { font-size:13px; color:var(--muted); }

.proc-step { display:flex; align-items:center; gap:12px; padding:10px 0; font-size:13px; color:var(--muted); }
.proc-step.active { color:var(--white); }
.proc-step.done { color:var(--green); }
.proc-step.fail { color:var(--red); }
.proc-step-icon { width:28px; height:28px; border-radius:var(--r-md); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; background:var(--surface-04); border:0.5px solid var(--border); }
.proc-step.active .proc-step-icon { background:var(--blue-tint-12); border-color:var(--border-active); }
.proc-step.done .proc-step-icon { background:rgba(34,197,94,0.12); border-color:rgba(34,197,94,0.3); }
.proc-step.fail .proc-step-icon { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.3); }
.proc-prog { width:100%; height:4px; background:var(--surface-06); border-radius:var(--r-full); overflow:hidden; margin-top:20px; }
.proc-prog-bar { height:100%; background:var(--blue); border-radius:var(--r-full); transition:width 0.5s; }
</style>
</head>
<body>
<div id="sidebarSlot"></div>
<div class="page-glow"></div>
<div class="main narrow" style="align-items:center; justify-content:flex-start; gap:28px;">
  <div style="text-align:center; max-width:520px;">
    <h1 style="font-family:var(--font-display); font-size:32px; font-weight:800; letter-spacing:-0.6px; color:var(--white); margin:0;">Record lecture</h1>
    <p style="font-size:14px; color:var(--muted); margin:8px 0 0;">select a class, then tap to record or upload audio.</p>
  </div>

  <div style="width:100%; max-width:720px;">
    <div class="label" style="margin-bottom:10px;">Select class</div>
    <div id="clsPicker" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;">
      <div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);"><div class="spinner"></div></div>
    </div>
  </div>

  <div id="recCard" style="width:100%; max-width:520px; background:var(--navy-card); border:0.5px solid var(--border); border-radius:var(--r-5xl); padding:44px 32px; display:none; flex-direction:column; align-items:center; gap:20px; margin-top:8px;">
    <div id="recArea" style="display:flex; flex-direction:column; align-items:center; gap:20px; width:100%;">
      <div class="rec-circle rec-idle" id="recBtn"><div class="rec-dot"></div></div>
      <div class="rec-timer" id="recTimer">0:00</div>
      <div class="rec-hint" id="recHint">tap to start recording</div>
    </div>
    <div id="recProcessing" style="display:none; width:100%;">
      <div style="font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--white); margin-bottom:8px; text-align:center;">Processing</div>
      <div style="font-size:13px; color:var(--muted); margin-bottom:20px; text-align:center;" id="procClassLabel"></div>
      <div class="proc-prog"><div class="proc-prog-bar" id="procBar" style="width:0%"></div></div>
      <div style="margin:24px 0 0;">
        <div class="proc-step" id="step-upload"><div class="proc-step-icon">☁️</div>Uploading audio</div>
        <div class="proc-step" id="step-transcribe"><div class="proc-step-icon">🎤</div>Transcribing audio</div>
        <div class="proc-step" id="step-summary"><div class="proc-step-icon">✨</div>Generating AI summary</div>
        <div class="proc-step" id="step-check"><div class="proc-step-icon">🔍</div>Checking for duplicates</div>
        <div class="proc-step" id="step-save"><div class="proc-step-icon">💾</div>Saving note</div>
      </div>
      <div id="procResult" style="margin-top:24px;"></div>
    </div>
  </div>

  <div id="uploadSection" style="display:none; gap:12px; margin-top:4px; flex-wrap:wrap; justify-content:center;">
    <label class="btn ghost" style="cursor:pointer;">📎 Upload audio<input type="file" id="fileInput" accept="audio/*" style="display:none"/></label>
    <span style="font-size:12px; color:var(--blue-bright); align-self:center;" id="fileName"></span>
    <button class="btn primary sm" id="uploadBtn" style="display:none;">Process →</button>
  </div>
</div>

<script type="module">
import{getStorage,ref,uploadBytes,deleteObject}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
import{httpsCallable}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';
import{requireUser,db,fns,doc,getDoc,setDoc,addDoc,updateDoc,collection,getDocs,query,where,orderBy,increment,loadClasses,esc,COLORS,logError,logSuccess,logInfo}from'./app-shared.js';

const storage=getStorage();
const aiTranscribeFn=httpsCallable(fns,'aiTranscribe');
const aiSummaryFn=httpsCallable(fns,'aiSummary');

let uid='',allClasses=[],selectedClassId='',selectedClassName='';
let mediaRecorder=null,audioChunks=[],recInterval=null,recSeconds=0;

requireUser().then(async(ctx)=>{
  uid=ctx.uid;
  try{const{classes,colorMap}=await loadClasses(uid);allClasses=classes;window._ccMap=colorMap;renderClassPicker();logInfo('Record page loaded — '+allClasses.length+' classes','record');}catch(e){logError('Record init failed: '+e.message,'record');}
});

function renderClassPicker(){
  const grid=document.getElementById('clsPicker');
  if(!allClasses.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);">📚 No classes — import your schedule in the iOS app first.</div>';return;}
  grid.innerHTML=allClasses.map((c)=>{
    const cid=c.classId||c.id;
    const color=(window._ccMap||{})[cid]||COLORS[0];
    return`<div class="cls-pick" data-id="${cid}" data-code="${esc(c.courseCode)}">
      <div class="cls-pick-bar" style="background:${color};"></div>
      <div style="flex:1; min-width:0;">
        <div class="cls-pick-code">${esc(c.courseCode)}</div>
        <div class="cls-pick-name">${esc(c.courseName||'')}</div>
      </div>
      <span class="cls-pick-check" style="display:none; color:var(--blue-bright); font-size:14px;">✓</span>
    </div>`;
  }).join('');
  grid.querySelectorAll('.cls-pick').forEach(card=>card.addEventListener('click',function(){
    grid.querySelectorAll('.cls-pick').forEach(c=>{c.classList.remove('selected');c.querySelector('.cls-pick-check').style.display='none';});
    this.classList.add('selected');this.querySelector('.cls-pick-check').style.display='inline';
    selectedClassId=this.dataset.id;selectedClassName=this.dataset.code;
    document.getElementById('recCard').style.display='flex';
    document.getElementById('uploadSection').style.display='flex';
    document.getElementById('recHint').textContent='tap to record '+selectedClassName;
  }));
}

document.getElementById('recBtn').addEventListener('click',async function(){
  if(!selectedClassId)return;
  if(!mediaRecorder||mediaRecorder.state==='inactive'){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'});audioChunks=[];
      mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
      mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());processAudio(new Blob(audioChunks,{type:'audio/webm'}));};
      mediaRecorder.start();recSeconds=0;
      document.getElementById('recTimer').textContent='0:00';
      document.getElementById('recHint').textContent='recording '+selectedClassName+'… tap to stop';
      this.className='rec-circle rec-active';
      recInterval=setInterval(()=>{recSeconds++;const m=Math.floor(recSeconds/60);const s=recSeconds%60;document.getElementById('recTimer').textContent=m+':'+(s<10?'0':'')+s;},1000);
      logInfo('Recording started: '+selectedClassName,'record');
    }catch(e){alert('Microphone access denied.');logError('Mic denied: '+e.message,'record/mic');}
  }else{mediaRecorder.stop();clearInterval(recInterval);this.className='rec-circle rec-idle';logInfo('Recording stopped — '+recSeconds+'s','record');}
});

let selectedFile=null;
document.getElementById('fileInput').addEventListener('change',function(){if(this.files[0]){selectedFile=this.files[0];document.getElementById('fileName').textContent=selectedFile.name;document.getElementById('uploadBtn').style.display='inline-flex';}});
document.getElementById('uploadBtn').addEventListener('click',()=>{if(!selectedFile||!selectedClassId)return;processAudio(selectedFile);});

function setStep(step,state){const el=document.getElementById('step-'+step);if(!el)return;el.className='proc-step '+state;const icon=el.querySelector('.proc-step-icon');if(state==='done')icon.textContent='✓';else if(state==='fail')icon.textContent='✗';}

async function processAudio(blob){
  document.getElementById('recArea').style.display='none';
  document.getElementById('uploadSection').style.display='none';
  document.getElementById('recProcessing').style.display='block';
  document.getElementById('procClassLabel').textContent=selectedClassName;
  document.getElementById('procBar').style.width='5%';
  document.getElementById('procResult').innerHTML='';
  ['upload','transcribe','summary','check','save'].forEach(s=>{const el=document.getElementById('step-'+s);el.className='proc-step';const icons={upload:'☁️',transcribe:'🎤',summary:'✨',check:'🔍',save:'💾'};el.querySelector('.proc-step-icon').textContent=icons[s];});

  const cls=allClasses.find(c=>(c.classId||c.id)===selectedClassId);
  let storagePath='';
  const sizeKB=Math.round(blob.size/1024);
  logInfo('Processing audio: '+sizeKB+'KB for '+selectedClassName,'record/process');

  try{
    setStep('upload','active');
    const ext=blob.type.includes('mp4')||blob.type.includes('m4a')?'m4a':'webm';
    storagePath=`audio/${uid}/${crypto.randomUUID()}.${ext}`;
    await uploadBytes(ref(storage,storagePath),blob,{contentType:blob.type||'audio/webm'});
    setStep('upload','done');
    document.getElementById('procBar').style.width='20%';
    logSuccess('Audio uploaded: '+sizeKB+'KB','record/upload');

    setStep('transcribe','active');
    const transcriptResult=await aiTranscribeFn({storagePath});
    const transcript=transcriptResult.data.transcript||'';
    if(!transcript||transcript.split(' ').length<10)throw new Error('Transcript too short — try a longer recording');
    setStep('transcribe','done');
    document.getElementById('procBar').style.width='40%';
    logSuccess('Transcribed: '+transcript.split(' ').length+' words','record/transcribe');

    setStep('summary','active');
    const prompt=buildSummaryPrompt(transcript);
    const summaryResult=await aiSummaryFn({prompt,max_output_tokens:8192});
    const rawJSON=summaryResult.data.content||'';
    if(!rawJSON)throw new Error('Empty summary response');
    setStep('summary','done');
    document.getElementById('procBar').style.width='60%';

    let cleaned=rawJSON.trim();
    const fenceMatch=cleaned.match(/```(?:json)?\s*\n?([\s\S]*?)\n?\s*```/i);
    if(fenceMatch)cleaned=fenceMatch[1].trim();
    if(!cleaned.startsWith('{')){
      const firstBrace=cleaned.indexOf('{');
      const lastBrace=cleaned.lastIndexOf('}');
      if(firstBrace!==-1&&lastBrace>firstBrace)cleaned=cleaned.slice(firstBrace,lastBrace+1);
    }
    cleaned=cleaned.replace(/\\(?!["\\/bfnrtu])/g,'\\\\');
    let parsed;
    try{
      parsed=JSON.parse(cleaned);
    }catch(e){
      const fallbackTitle=(cls?.courseCode||'Lecture')+' — '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const looksJSON=/^\s*[\{\[]/.test(rawJSON.trim());
      parsed={
        title:fallbackTitle,
        summary:looksJSON
          ?'⚠️ The AI returned a response we could not parse. Your transcript was saved — open this note and try regenerating the summary, or record a shorter segment.'
          :rawJSON.trim(),
        keyPoints:[]
      };
      logError('JSON parse failed: '+e.message+' | preview: '+rawJSON.slice(0,200).replace(/\s+/g,' '),'record/parse');
    }
    const aiTitle=parsed.title||cls?.courseCode+' — '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
    logSuccess('Summary generated: '+aiTitle,'record/summary');

    setStep('check','active');
    const now=Date.now()/1000;
    const sixHoursAgo=now-(6*60*60);
    const existingSnap=await getDocs(query(
      collection(db,'classes',selectedClassId,'notes'),
      where('createdAt','>',sixHoursAgo)
    ));
    document.getElementById('procBar').style.width='75%';

    let savedAsAlternate=false;
    let noteId='';

    if(existingSnap.docs.length>0){
      const primaryDoc=existingSnap.docs[0];
      noteId=primaryDoc.id;
      setStep('check','done');
      logInfo('Duplicate found — saving as alternate under '+noteId,'record/dedup');

      setStep('save','active');
      const alternateData={
        title:aiTitle,transcript,
        summary:parsed.summary||'',keyPoints:parsed.keyPoints||[],
        rawJSON:cleaned,sourceType:'audio',
        createdAt:now,createdBy:uid
      };
      await addDoc(collection(db,'classes',selectedClassId,'notes',noteId,'alternates'),alternateData);
      await updateDoc(doc(db,'classes',selectedClassId,'notes',noteId),{alternateCount:increment(1)});
      savedAsAlternate=true;
      setStep('save','done');
      document.getElementById('procBar').style.width='100%';
      logSuccess('Alternate saved under note '+noteId+' (version '+(primaryDoc.data().alternateCount+2)+')','record/save');
    }else{
      setStep('check','done');
      logInfo('No duplicate — creating new note','record/dedup');

      setStep('save','active');
      const noteRef=doc(collection(db,'classes',selectedClassId,'notes'));
      noteId=noteRef.id;
      await setDoc(noteRef,{
        title:aiTitle,transcript,
        summary:parsed.summary||'',keyPoints:parsed.keyPoints||[],
        rawJSON:cleaned,sourceType:'audio',
        createdAt:now,createdBy:uid,alternateCount:0
      });
      setStep('save','done');
      document.getElementById('procBar').style.width='100%';
      logSuccess('New note saved: '+aiTitle+' ('+noteId+')','record/save');
    }

    try{await deleteObject(ref(storage,storagePath));}catch(e){}

    const resultMsg=savedAsAlternate
      ?`<div style="font-size:15px;font-weight:600;color:var(--green);margin-bottom:4px;">✅ Added as alternate version!</div><div style="font-size:12px;color:var(--muted);margin-bottom:4px;">${esc(aiTitle)}</div><div style="font-size:11px;color:var(--orange);margin-bottom:12px;">📄 A note from this lecture already existed — your recording was added as another version.</div>`
      :`<div style="font-size:15px;font-weight:600;color:var(--green);margin-bottom:4px;">✅ Note saved!</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px;">${esc(aiTitle)} · ${transcript.split(' ').length} words · ${(parsed.keyPoints||[]).length} key points</div>`;

    document.getElementById('procResult').innerHTML=`<div style="background:rgba(34,197,94,0.08);border:0.5px solid rgba(34,197,94,0.3);border-radius:var(--r-xl);padding:16px;">${resultMsg}<div style="display:flex;gap:8px;justify-content:center;"><a class="btn primary sm" href="note.html?classId=${selectedClassId}&noteId=${noteId}">View note →</a><button class="btn ghost sm" id="recAgain">Record another</button></div></div>`;
    document.getElementById('recAgain')?.addEventListener('click',resetRec);

  }catch(e){
    console.error('Recording error:',e);
    logError('Recording failed: '+e.message+' ('+sizeKB+'KB, '+selectedClassName+')','record/process');
    if(storagePath){try{await deleteObject(ref(storage,storagePath));}catch(ex){}}
    ['upload','transcribe','summary','check','save'].forEach(s=>{const el=document.getElementById('step-'+s);if(el.classList.contains('active'))setStep(s,'fail');});
    document.getElementById('procResult').innerHTML=`<div style="background:rgba(239,68,68,0.08);border:0.5px solid rgba(239,68,68,0.3);border-radius:var(--r-xl);padding:16px;"><div style="font-size:14px;color:var(--red);margin-bottom:8px;">❌ ${esc(e.message)}</div><button class="btn ghost sm" id="retryBtn">Try again</button></div>`;
    document.getElementById('retryBtn')?.addEventListener('click',resetRec);
  }
}

function buildSummaryPrompt(transcript){
  const today=new Date(),todayISO=today.toISOString().split('T')[0],todayDisplay=today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return`You are an expert note-taker reading a transcript from a college class lecture recording.

Today's date is ${todayISO} (display as ${todayDisplay}).

Your job is to produce comprehensive, detailed, study-ready notes a student could use to fully review the lecture without re-listening.

RULES:
- Only include actual lecture content from the instructor. Ignore side chatter, jokes, greetings, and off-topic talk.
- Only extract assignments, exams, and schedule changes if they clearly came from the instructor.
- Convert any spoken or relative date into a real YYYY-MM-DD calendar date. If you truly cannot determine the date, use an empty string.

TITLE: Write a specific, descriptive title (5-10 words). Format: "Topic Name — MMM d"

SUMMARY FORMAT: Write using ## headers (8-15 total), tables for definitions/comparisons with | --- | separator rows, - bullets with 4-space sub-bullets, and plain paragraphs. Aim for 800-1500 words. No emoji.

STRUCTURE: Start with ## Overview, then 6-12 content sections, ## Key Terms And Definitions table, ## Common Mistakes To Avoid, ## Examples And Classroom Questions.

KEY POINTS: 6-12 specific facts, 1-2 sentences each. No emoji.

Return strict JSON with no markdown backticks:
{"title":"...","summary":"...","keyPoints":["..."],"assignments":[{"title":"...","dueDate":"YYYY-MM-DD"}],"exams":[{"title":"...","date":"YYYY-MM-DD","type":"exam|quiz|test"}],"scheduleChanges":[{"title":"...","date":"YYYY-MM-DD"}]}

Transcript:
${transcript}`;
}

function resetRec(){
  document.getElementById('recArea').style.display='flex';
  document.getElementById('uploadSection').style.display='flex';
  document.getElementById('recProcessing').style.display='none';
  document.getElementById('recTimer').textContent='0:00';
  document.getElementById('recHint').textContent='tap to record '+selectedClassName;
  document.getElementById('recBtn').className='rec-circle rec-idle';
  selectedFile=null;
  document.getElementById('fileName').textContent='';
  document.getElementById('uploadBtn').style.display='none';
  document.getElementById('fileInput').value='';
}
</script>
</body>
</html>
